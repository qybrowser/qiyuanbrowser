<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浏览器起始页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 0 0 40px;
      color: #333;
    }
    .ip-banner {
      background: linear-gradient(135deg, #2845d4 0%, #1a2fa8 100%);
      padding: 36px 20px;
      text-align: center;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .ip-banner::before {
      content: '';
      position: absolute; left: 0; top: 0; width: 220px; height: 100%;
      background-image: radial-gradient(circle, rgba(255,255,255,.08) 1px, transparent 1px);
      background-size: 18px 18px;
    }
    .ip-banner-inner {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .ip-loading { display: flex; align-items: center; gap: 10px; font-size: 15px; opacity: .8; }
    .spin {
      width: 20px; height: 20px; border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .container { max-width: 960px; margin: 0 auto; padding: 24px 20px 0; }
    .card {
      background: #fff; border-radius: 12px;
      padding: 24px; margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .card-title {
      font-size: 16px; font-weight: 600; color: #409eff;
      margin-bottom: 16px; padding-bottom: 10px;
      border-bottom: 1px solid #e8f0fe;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2px 0;
    }
    .info-item {
      display: flex; align-items: baseline;
      padding: 7px 0; border-bottom: 1px solid #f5f5f5;
    }
    .info-item.full { grid-column: 1 / -1; }
    .info-label { color: #909399; font-size: 13px; min-width: 110px; flex-shrink: 0; }
    .info-value { color: #303133; font-size: 13px; word-break: break-all; }
    .info-value.ua { font-size: 11px; color: #606266; line-height: 1.6; }
    #err-tip { color: rgba(255,255,255,.75); font-size: 14px; padding: 20px; }
  </style>
</head>
<body>

<div class="ip-banner">
  <div id="ip-section" class="ip-banner-inner">
    <div class="ip-loading"><div class="spin"></div><span>IP 检测中...</span></div>
  </div>
</div>

<div class="container" id="main-content" style="display:none"></div>

<script src="home.js"></script>
</body>
</html>
